[package]
name = "gitkrapao"
version = "0.4.0"
description = "A personal Git graph viewer"
edition = "2021"
rust-version = "1.90"

[lib]
name = "gitkrapao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
ts-rs = "12.0.1"
