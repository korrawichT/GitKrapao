name: Feature request
description: An idea for something GitKrapao could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, not the solution yet. For example "I switch between many repositories every day".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. A sketch or a screenshot from another tool is welcome.
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In a terminal, another tool, or not at all.
